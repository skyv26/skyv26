<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Inter, Arial, sans-serif">
<title id="t">Reference architecture for an AI-enabled SaaS</title>
<desc id="d">Five layers — experience, edge, application, intelligence, data — with animated request flow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0F"/><stop offset="1" stop-color="#15121D"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E76F36"/><stop offset=".55" stop-color="#FF4D8D"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E76F36"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#E76F36" stop-opacity=".35"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <radialGradient id="fade" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
  <mask id="gridmask"><rect width="1200" height="500" fill="url(#fade)"/></mask>
  <clipPath id="card"><rect width="1200" height="500" rx="28"/></clipPath>
  
</defs>
<style>
  .t{fill:#F5F3EE} .m{fill:#A9A6B5} .dim{fill:#6C6A78} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-200}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  .b1{animation:drift1 14s ease-in-out infinite} .b2{animation:drift2 18s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
  .flow{stroke-dasharray:6 10;animation:dash 6s linear infinite}
  
</style>
<g clip-path="url(#card)">
<rect width="1200" height="500" fill="url(#bg)"/>
<rect width="1200" height="500" fill="url(#grid)" mask="url(#gridmask)"/>
<g class="b1"><circle cx="600" cy="280" r="260" fill="#8B5CF6" opacity="0.22" filter="url(#blur)"/></g><g class="b2"><circle cx="100" cy="80" r="160" fill="#E76F36" opacity="0.25" filter="url(#blur)"/></g><g class="b1"><circle cx="1120" cy="500" r="160" fill="#FF4D8D" opacity="0.22" filter="url(#blur)"/></g><text x="56" y="70" font-size="13" class="mono m" letter-spacing="4">REFERENCE BLUEPRINT · NOT A DIAGRAM OF ANY ONE PRODUCT</text><rect x="56" y="110" width="196" height="320" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="74" y="146" font-size="11" class="mono" fill="#E76F36" letter-spacing="2">L1</text><text x="74" y="172" font-size="17" font-weight="800" class="t" letter-spacing="1">EXPERIENCE</text><rect x="70" y="210" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="84" y="243" font-size="12.5" class="t">Web · PWA</text><rect x="70" y="284" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="84" y="317" font-size="12.5" class="t">Desktop · Tauri</text><path d="M252 250H284" stroke="url(#acc)" stroke-width="2.5" class="flow"/><path d="M252 290H284" stroke="#FFF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="284" y="110" width="196" height="320" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="302" y="146" font-size="11" class="mono" fill="#E76F36" letter-spacing="2">L2</text><text x="302" y="172" font-size="17" font-weight="800" class="t" letter-spacing="1">EDGE</text><rect x="298" y="210" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="312" y="243" font-size="12.5" class="t">Auth · RBAC</text><rect x="298" y="284" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="312" y="317" font-size="11" class="t">Rate limits · bot protection</text><path d="M480 250H512" stroke="url(#acc)" stroke-width="2.5" class="flow"/><path d="M480 290H512" stroke="#FFF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="512" y="110" width="196" height="320" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="530" y="146" font-size="11" class="mono" fill="#E76F36" letter-spacing="2">L3</text><text x="530" y="172" font-size="17" font-weight="800" class="t" letter-spacing="1">APPLICATION</text><rect x="526" y="210" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="540" y="243" font-size="12.5" class="t">Domain services</text><rect x="526" y="284" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="540" y="317" font-size="12.5" class="t">Approvals · audit</text><rect x="526" y="358" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="540" y="391" font-size="11" class="t">Jobs · PDFs · notifications</text><path d="M708 250H740" stroke="url(#acc)" stroke-width="2.5" class="flow"/><path d="M708 290H740" stroke="#FFF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="740" y="110" width="196" height="320" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="758" y="146" font-size="11" class="mono" fill="#E76F36" letter-spacing="2">L4</text><text x="758" y="172" font-size="17" font-weight="800" class="t" letter-spacing="1">INTELLIGENCE</text><rect x="754" y="210" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="768" y="243" font-size="12.5" class="t">Agent orchestration</text><rect x="754" y="284" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="768" y="317" font-size="11" class="t">Retrieval · embeddings</text><path d="M936 250H968" stroke="url(#acc)" stroke-width="2.5" class="flow"/><path d="M936 290H968" stroke="#FFF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5"/><rect x="968" y="110" width="196" height="320" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="986" y="146" font-size="11" class="mono" fill="#E76F36" letter-spacing="2">L5</text><text x="986" y="172" font-size="17" font-weight="800" class="t" letter-spacing="1">DATA</text><rect x="982" y="210" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="996" y="243" font-size="12.5" class="t">PostgreSQL / MongoDB</text><rect x="982" y="284" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="996" y="317" font-size="12.5" class="t">Redis</text><rect x="982" y="358" width="168" height="56" rx="12" fill="#0A0A0F" stroke="url(#acc)" stroke-opacity=".6"/><text x="996" y="391" font-size="12.5" class="t">Object storage</text><text x="56" y="470" font-size="12" class="mono dim" letter-spacing="2">EVERY LAYER CONTAINERISED · SHIPPED THROUGH CI/CD · OBSERVABLE IN PRODUCTION</text></g>
<rect x=".75" y=".75" width="1198.5" height="498.5" rx="28" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
