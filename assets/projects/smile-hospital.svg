<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Inter, Arial, sans-serif">
<title id="t">03 — SMILE MEDICAL HOSPITAL</title>
<desc id="d">Healthcare · Institutional. Web platform for a registered hospital in Freetown, Sierra Leone.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0F"/><stop offset="1" stop-color="#15121D"/></linearGradient>
