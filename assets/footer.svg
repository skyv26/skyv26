<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Inter, Arial, sans-serif">
<title id="t">Systems with purpose</title>
<desc id="d">Footer wave and signature.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0F"/><stop offset="1" stop-color="#15121D"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E76F36"/><stop offset=".55" stop-color="#FF4D8D"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E76F36"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#E76F36" stop-opacity=".35"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <radialGradient id="fade" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
  <mask id="gridmask"><rect width="1200" height="200" fill="url(#fade)"/></mask>
  <clipPath id="card"><rect width="1200" height="200" rx="28"/></clipPath>
  
</defs>
<style>
  .t{fill:#F5F3EE} .m{fill:#A9A6B5} .dim{fill:#6C6A78} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-200}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  .b1{animation:drift1 14s ease-in-out infinite} .b2{animation:drift2 18s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
  .flow{stroke-dasharray:6 10;animation:dash 6s linear infinite}
  
</style>
<g clip-path="url(#card)">
<rect width="1200" height="200" fill="url(#bg)"/>

<path d="M-200 130 q75 -24 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#E76F36" stroke-width="2" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 0;300 0" dur="7s" repeatCount="indefinite"/></path><path d="M-200 142 q75 -18 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#FF4D8D" stroke-width="2" opacity="0.45"><animateTransform attributeName="transform" type="translate" values="0 0;300 0" dur="9s" repeatCount="indefinite"/></path><path d="M-200 154 q75 -12 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;300 0" dur="11s" repeatCount="indefinite"/></path><text x="600" y="80" text-anchor="middle" font-size="34" font-weight="800" fill="url(#acc)" letter-spacing="-1">SYSTEMS WITH PURPOSE.</text><text x="600" y="110" text-anchor="middle" font-size="12" class="mono m" letter-spacing="4">AAKASH VERMA · SKYV26</text></g>
<rect x=".75" y=".75" width="1198.5" height="198.5" rx="28" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
