<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Business and jewellery finance artwork</title>
<desc id="desc">Geometric valuation and inventory visualisation.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E76F36" stop-opacity=".22"/>
    <stop offset="1" stop-color="#E76F36" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  :root { color: #242424; }
  @media (prefers-color-scheme: dark) {
    :root { color: #eeeeea; }
  }
  .ink { fill: currentColor; }
  .muted { fill: currentColor; opacity: .62; }
  .line { stroke: currentColor; stroke-opacity: .35; fill: none; }
  .orange { fill: #E76F36; }
  .orange-line { stroke: #E76F36; fill: none; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>

<rect width="1200" height="220" fill="url(#grid)"/>
<g transform="translate(110 26)">
<path d="M90 0L170 45V135L90 180L10 135V45Z" class="line" stroke-width="2"/>
<path d="M90 0V90L170 45M90 90L10 45M90 90V180" class="orange-line" stroke-width="2"/>
<circle cx="90" cy="90" r="22" class="orange"/>
</g>
<g transform="translate(390 36)">
<path d="M0 130H650" class="line"/>
<path d="M40 130V82H100V130M140 130V48H200V130M240 130V18H300V130M340 130V68H400V130M440 130V32H500V130" class="orange-line" stroke-width="5"/>
<path d="M40 45L170 15L270 0L370 30L490 0" class="line" stroke-width="2"/>
<circle cx="270" cy="0" r="6" class="orange"/>
</g>
<text x="70" y="202" class="muted" font-size="13" letter-spacing="3">INVENTORY / VALUATION / FINANCIAL HISTORY</text>

</svg>