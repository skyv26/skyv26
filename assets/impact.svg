<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Inter, Arial, sans-serif">
<title id="t">Community impact</title>
<desc id="d">Mentorship and code review figures: 100+ developers collaborated with; TOP 40 global mentor; 1,000+ projects code-reviewed; 100+ engineers helped level up; 50+ web applications; 10+ iot &amp; hardware systems; 5,000+ contributions</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0F"/><stop offset="1" stop-color="#15121D"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E76F36"/><stop offset=".55" stop-color="#FF4D8D"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E76F36"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#E76F36" stop-opacity=".35"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <radialGradient id="fade" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
  <mask id="gridmask"><rect width="1200" height="400" fill="url(#fade)"/></mask>
  <clipPath id="card"><rect width="1200" height="400" rx="28"/></clipPath>
  
</defs>
<style>
  .t{fill:#F5F3EE} .m{fill:#A9A6B5} .dim{fill:#6C6A78} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-200}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  .b1{animation:drift1 14s ease-in-out infinite} .b2{animation:drift2 18s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
  .flow{stroke-dasharray:6 10;animation:dash 6s linear infinite}
  
</style>
<g clip-path="url(#card)">
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#grid)" mask="url(#gridmask)"/>
<g class="b1"><circle cx="200" cy="380" r="200" fill="#E76F36" opacity="0.25" filter="url(#blur)"/></g><g class="b2"><circle cx="1000" cy="40" r="200" fill="#FF4D8D" opacity="0.2" filter="url(#blur)"/></g><rect x="56" y="58" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="78" y="130" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">100+</text><text x="78" y="164" font-size="10.5" class="mono m" letter-spacing="1.2">DEVELOPERS COLLABORATED WITH</text><rect x="332" y="58" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="354" y="130" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">TOP 40</text><text x="354" y="164" font-size="10.5" class="mono m" letter-spacing="1.2">GLOBAL MENTOR</text><rect x="608" y="58" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="630" y="130" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">1,000+</text><text x="630" y="164" font-size="10.5" class="mono m" letter-spacing="1.2">PROJECTS CODE-REVIEWED</text><rect x="884" y="58" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="906" y="130" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">100+</text><text x="906" y="164" font-size="10.5" class="mono m" letter-spacing="1.2">ENGINEERS HELPED LEVEL UP</text><rect x="194.0" y="220" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="216.0" y="292" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">50+</text><text x="216.0" y="326" font-size="10.5" class="mono m" letter-spacing="1.2">WEB APPLICATIONS</text><rect x="470.0" y="220" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="492.0" y="292" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">10+</text><text x="492.0" y="326" font-size="10.5" class="mono m" letter-spacing="1.2">IOT &amp; HARDWARE SYSTEMS</text><rect x="746.0" y="220" width="254" height="140" rx="18" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".12"/><text x="768.0" y="292" font-size="46" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">5,000+</text><text x="768.0" y="326" font-size="10.5" class="mono m" letter-spacing="1.2">CONTRIBUTIONS</text></g>
<rect x=".75" y=".75" width="1198.5" height="398.5" rx="28" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
