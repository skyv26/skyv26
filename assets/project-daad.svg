<rect x="22" y="22" width="55" height="42" class="orange" opacity=".9"/>
<rect x="92" y="22" width="65" height="12" class="line"/>
<rect x="92" y="45" width="65" height="12" class="line"/>
<rect x="22" y="82" width="135" height="25" class="line"/>
</g>
<g transform="translate(430 52)">
<circle cx="50" cy="45" r="38" class="orange" opacity=".85"/>
