<path d="M50 7V83M12 45H88" class="line"/>
<path d="M95 45H220" class="orange-line" stroke-width="2"/>
<rect x="220" y="0" width="180" height="90" class="line"/>
<path d="M240 24H380M240 45H350M240 66H370" class="line"/>
