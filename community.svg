<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">Community illustration</title>
<desc id="desc">Connected people and shared knowledge illustration.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E76F36" stop-opacity=".22"/>
    <stop offset="1" stop-color="#E76F36" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  :root { color: #242424; }
  @media (prefers-color-scheme: dark) {
    :root { color: #eeeeea; }
  }
  .ink { fill: currentColor; }
  .muted { fill: currentColor; opacity: .62; }
  .line { stroke: currentColor; stroke-opacity: .35; fill: none; }
  .orange { fill: #E76F36; }
  .orange-line { stroke: #E76F36; fill: none; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>

<rect width="1200" height="180" fill="url(#grid)"/>
<path d="M220 90H980M380 45L600 90L820 45M380 135L600 90L820 135" class="line" stroke-width="2"/>
<g fill="none" stroke="#E76F36" stroke-width="3">
<circle cx="220" cy="90" r="24"/><circle cx="380" cy="45" r="18"/><circle cx="380" cy="135" r="18"/>
<circle cx="600" cy="90" r="34"/><circle cx="820" cy="45" r="18"/><circle cx="820" cy="135" r="18"/><circle cx="980" cy="90" r="24"/>
</g>
<g class="muted" font-size="13" letter-spacing="2">
<text x="220" y="150" text-anchor="middle">LEARN</text><text x="600" y="150" text-anchor="middle">SHARE</text><text x="980" y="150" text-anchor="middle">GROW</text>
</g>

</svg>