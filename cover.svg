<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Aakash Verma editorial cover</title>
<desc id="desc">Abstract Swiss editorial grid with orange signal geometry.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E76F36" stop-opacity=".22"/>
    <stop offset="1" stop-color="#E76F36" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  :root { color: #242424; }
  @media (prefers-color-scheme: dark) {
    :root { color: #eeeeea; }
  }
  .ink { fill: currentColor; }
  .muted { fill: currentColor; opacity: .62; }
  .line { stroke: currentColor; stroke-opacity: .35; fill: none; }
  .orange { fill: #E76F36; }
  .orange-line { stroke: #E76F36; fill: none; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>

<rect width="1200" height="360" fill="url(#grid)"/>
<circle cx="1010" cy="165" r="190" fill="url(#fade)"/>
<path d="M720 0V360M840 0V360M960 0V360M1080 0V360" class="line"/>
<path d="M0 90H1200M0 180H1200M0 270H1200" class="line"/>
<path d="M760 270L960 70L1160 270" class="orange-line" stroke-width="3"/>
<path d="M840 270L960 150L1080 270" class="orange-line" stroke-width="2" opacity=".65"/>
<circle cx="960" cy="70" r="8" class="orange"/>
<rect x="746" y="256" width="28" height="28" class="orange"/>
<path d="M0 320H460" class="orange-line" stroke-width="4"/>
<text x="48" y="62" class="muted" font-size="16" letter-spacing="4">INDEPENDENT ENGINEERING JOURNAL / 001</text>
<text x="48" y="130" class="ink" font-size="54" font-weight="750" letter-spacing="-2">SYSTEMS</text>
<text x="48" y="190" class="ink" font-size="54" font-weight="750" letter-spacing="-2">WITH PURPOSE.</text>
<text x="50" y="235" class="muted" font-size="17" letter-spacing="3">PRODUCTS · ARCHITECTURE · INTELLIGENCE</text>
<text x="1150" y="330" text-anchor="end" class="muted" font-size="13" letter-spacing="3">AAKASH / SKYBREL</text>

</svg>