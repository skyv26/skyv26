<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Astrology digital product artwork</title>
<desc id="desc">Abstract orbit and structured digital reading illustration.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E76F36" stop-opacity=".22"/>
    <stop offset="1" stop-color="#E76F36" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  :root { color: #242424; }
  @media (prefers-color-scheme: dark) {
    :root { color: #eeeeea; }
  }
  .ink { fill: currentColor; }
  .muted { fill: currentColor; opacity: .62; }
  .line { stroke: currentColor; stroke-opacity: .35; fill: none; }
  .orange { fill: #E76F36; }
  .orange-line { stroke: #E76F36; fill: none; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>

<rect width="1200" height="220" fill="url(#grid)"/>
<circle cx="260" cy="105" r="78" class="line" stroke-width="2"/>
<circle cx="260" cy="105" r="48" class="orange-line" stroke-width="2"/>
<circle cx="260" cy="105" r="8" class="orange"/>
<ellipse cx="260" cy="105" rx="120" ry="42" transform="rotate(-28 260 105)" class="line"/>
<path d="M260 16V194M170 105H350" class="line"/>
<g transform="translate(520 35)">
<rect width="190" height="150" class="line" stroke-width="2"/>
<path d="M24 30H165M24 52H150M24 74H165M24 96H130M24 118H155" class="line"/>
<rect x="24" y="30" width="8" height="88" class="orange"/>
</g>
<g transform="translate(820 45)">
<path d="M0 90C45 10 105 10 150 90S255 170 300 90" class="orange-line" stroke-width="3"/>
<circle cx="0" cy="90" r="6" class="orange"/>
<circle cx="150" cy="90" r="6" class="orange"/>
<circle cx="300" cy="90" r="6" class="orange"/>
</g>
<text x="70" y="202" class="muted" font-size="13" letter-spacing="3">STRUCTURED KNOWLEDGE / PERSONAL READING / DIGITAL EXPERIENCE</text>

</svg>