<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">Engineering journey timeline</title>
<desc id="desc">A four-stage engineering journey.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="currentColor" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E76F36" stop-opacity=".22"/>
    <stop offset="1" stop-color="#E76F36" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  :root { color: #242424; }
  @media (prefers-color-scheme: dark) {
    :root { color: #eeeeea; }
  }
  .ink { fill: currentColor; }
  .muted { fill: currentColor; opacity: .62; }
  .line { stroke: currentColor; stroke-opacity: .35; fill: none; }
  .orange { fill: #E76F36; }
  .orange-line { stroke: #E76F36; fill: none; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>

<rect width="1200" height="210" fill="url(#grid)"/>
<path d="M110 100H1090" class="line" stroke-width="2"/>
<g>
<circle cx="150" cy="100" r="13" class="orange"/>
<circle cx="450" cy="100" r="13" class="orange"/>
<circle cx="750" cy="100" r="13" class="orange"/>
<circle cx="1050" cy="100" r="13" class="orange"/>
<path d="M150 87V48M450 113V153M750 87V48M1050 113V153" class="orange-line" stroke-width="2"/>
<text x="150" y="32" text-anchor="middle" class="ink" font-size="18" font-weight="700">01 / EMBEDDED</text>
<text x="450" y="180" text-anchor="middle" class="ink" font-size="18" font-weight="700">02 / FULL STACK</text>
<text x="750" y="32" text-anchor="middle" class="ink" font-size="18" font-weight="700">03 / PRODUCTS</text>
<text x="1050" y="180" text-anchor="middle" class="ink" font-size="18" font-weight="700">04 / INTELLIGENCE</text>
<text x="150" y="55" text-anchor="middle" class="muted" font-size="12">HARDWARE + CODE</text>
<text x="450" y="202" text-anchor="middle" class="muted" font-size="12">APPLICATIONS + APIS</text>
<text x="750" y="55" text-anchor="middle" class="muted" font-size="12">SAAS + ARCHITECTURE</text>
<text x="1050" y="202" text-anchor="middle" class="muted" font-size="12">AI + CROSS-PLATFORM</text>
</g>

</svg>